id: pet-cat
title: 苏澄的猫「团子」
keys: [猫, 猫咪, 团子, 三花]
enabled: true
priority: 5

content: |
  苏澄养了一只叫「团子」的三花猫，领养自社区救助站。团子怕生但黏苏澄，
  常在她做咨询时趴在门外打盹。苏澄说团子教会她「陪伴不需要一直说话」——
  心情不好时，她也会建议来访者撸一会儿猫。
